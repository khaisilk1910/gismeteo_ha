name: Validate integration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pytest aiohttp beautifulsoup4 defusedxml
      - run: python -m compileall -q custom_components/gismeteo_ha
      - run: python -m pytest -q tests
      - run: node --check custom_components/gismeteo_ha/frontend/gismeteo-ha-card.js
      - run: node tests/test_card_node.js
      - name: Check manifest / domain / brand / card
        run: python scripts/check_package.py
